services:
  - type: web
    name: kushals-gym-site
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kushalgym-db
          property: connectionString
      - key: GYM_NAME
        value: "KUSHAL'S GYM SITE"
      - key: GYM_TAGLINE
        value: "BUILD STRONGER. LIVE STRONGER."
      - key: GYM_PHONE
        value: "+91 98XXX XXXXX"
      - key: GYM_EMAIL
        value: "contact@kushalgym.demo"
      - key: GYM_ADDRESS
        value: "123 Fitness Boulevard, Sector XX, Metro City, 000000"
      - key: GYM_WHATSAPP
        value: "9198XXXXXXXX"
      - key: GYM_INSTAGRAM
        value: "https://instagram.com/yourgymhandle"

databases:
  - name: kushalgym-db
    databaseName: kushalgym
    user: kushalgym_user
    plan: free
