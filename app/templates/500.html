{% extends "base.html" %}

{% block title %}Server Error (500) | {{ gym_name }}{% endblock %}

{% block content %}
<section class="py-5 mt-5 d-flex align-items-center" style="min-height: 75vh;">
  <div class="container py-5 text-center">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h1 class="h2 fw-bold text-white mb-3">INTERNAL SERVER ERROR</h1>
    <p class="text-secondary max-w-md mx-auto mb-4" style="max-width: 500px;">
      Our systems encountered an unexpected resistance threshold. Our technical team has been notified.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn-primary-glow px-4 py-2">
      <i class="bi bi-house-door-fill"></i> BACK TO HOME
    </a>
  </div>
</section>
{% endblock %}
